name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        npm: [bundled]
        include:
          # npm 12 は既定の挙動が変わった（git からの取得の無効化、依存の install スクリプトのブロックなど）ので別に確かめる
          - node: 26
            npm: "12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: npm を指定の版にする
        if: matrix.npm != 'bundled'
        run: npm install -g npm@${{ matrix.npm }}
      - run: node -v && npm -v
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: テスト
        run: npm test
      - name: ビルドして CLI を実行
        run: |
          npm run build
          node dist/cli.js --input examples/freelancer.json
          node dist/cli.js --input examples/side-job.json --json > /dev/null

  # 公開ページ（docs/）を実際のブラウザで操作して確かめる。Chrome が要るので、上のテストとは別のジョブにしている
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chrome の版
        run: google-chrome --version
      - name: 公開ページを Chrome で操作するテスト
        run: npm run test:browser
      - name: README と Skill が案内している版が、npm に実在することを確かめる
        run: |
          pinned="$(node -p 'require("./package.json").config.npmPinned')"
          found="$(npm view "setsuzei@$pinned" version)"
          test "$found" = "$pinned" || { echo "::error::setsuzei@$pinned が npm にありません"; exit 1; }
          echo "setsuzei@$pinned は npm にあります"
